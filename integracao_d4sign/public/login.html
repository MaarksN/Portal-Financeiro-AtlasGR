<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>CONTRATO, COBRANÇAS, RECORRÊNCIAS E REEMBOLSO TUDO NUM SÓ LUGAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script>
  (function () {
    try {
      var salvo = localStorage.getItem("atlas-fin-tema");
      var tema = salvo || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro");
      document.documentElement.setAttribute("data-tema", tema);
    } catch (e) {
      document.documentElement.setAttribute("data-tema", "claro");
    }
  })();
</script>
<link rel="stylesheet" href="styles.css" />
<style>
  #btn-entrar:hover {
    box-shadow: 0 6px 20px rgba(255, 86, 24, 0.6) !important;
    transform: translateY(-1px);
  }
  .login-card:hover {
    box-shadow: 0 0 30px rgba(255, 86, 24, 0.3), 0 0 50px rgba(255, 86, 24, 0.15) !important;
  }
</style>
</head>
<body>

<div class="letterhead">
  <div class="letterhead-inner">
    <div class="letterhead-brand">
      <svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg" fill="#FF5618" style="width:38px;height:auto;">
        <polygon points="41,0 81,0 63,70 1,70" />
        <polygon points="63,70 100,70 81,36" />
      </svg>
      <div class="letterhead-divider"></div>
      <div class="letterhead-tagline">ATLASGR FINANCEIRO</div>
    </div>
  </div>
</div>

<div class="login-shell">
  <div class="card login-card" style="box-shadow: 0 0 20px rgba(255, 86, 24, 0.2), 0 0 40px rgba(255, 86, 24, 0.1); border: 1px solid rgba(255, 86, 24, 0.3);">
    <h2 style="color: #FF5618; font-size: 1.5rem; margin-bottom: 0.5rem; text-shadow: 0 0 10px rgba(255, 86, 24, 0.3);">Portal Financeiro AtlasGR</h2>
    <p class="card-sub" style="font-weight: 500; font-size: 1rem; color: var(--texto); margin-bottom: 2rem;">Contrato, cobranças, recorrências e reembolso tudo num só lugar.</p>

    <form id="form-login">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" required />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required />

      <button type="submit" id="btn-entrar" style="box-shadow: 0 4px 15px rgba(255, 86, 24, 0.4); transition: box-shadow 0.3s ease;">Entrar</button>
      <p class="erro oculto" id="erro-login"></p>
    </form>
  </div>
</div>

<script>
  const form = document.getElementById("form-login");
  const erroEl = document.getElementById("erro-login");
  const btn = document.getElementById("btn-entrar");

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    erroEl.classList.add("oculto");
    btn.disabled = true;
    btn.textContent = "Entrando...";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          usuario: document.getElementById("usuario").value.trim(),
          senha: document.getElementById("senha").value,
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || "Falha ao entrar.");
      window.location.href = "/";
    } catch (err) {
      erroEl.textContent = err.message;
      erroEl.classList.remove("oculto");
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });

  // Se ja existe sessao valida, pula direto pro painel.
  fetch("/api/me").then((r) => r.json()).then((data) => {
    if (data.autenticado) window.location.href = "/";
  }).catch(() => {});
</script>
</body>
</html>
