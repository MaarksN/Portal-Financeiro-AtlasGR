<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Central Atlas GR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="tela-login">

<main class="login-wrap">
  <a href="/" class="mark neg mark-login">
    <svg class="logo-simbolo" viewBox="0 0 44 36" aria-hidden="true">
      <polygon points="13,34 23,34 35,2 25,2"/>
      <polygon points="27,34 37,34 37,14"/>
    </svg>
    <span class="logo-texto"><b>Atlas</b><small>Central interna</small></span>
  </a>

  <form class="login-cartao" id="form-login">
    <h2>Entrar</h2>
    <p class="login-sub">Reembolso e cobranças — num lugar só.</p>

    <label class="campo"><span>E-mail</span>
      <input type="email" name="email" required autocomplete="username" placeholder="voce@atlasgr.com.br">
    </label>
    <label class="campo"><span>Senha</span>
      <input type="password" name="senha" required autocomplete="current-password" placeholder="••••••••">
    </label>

    <button class="botao" type="submit" id="botao-entrar">Entrar</button>
    <div id="msg-login"></div>

    <p class="login-demo" id="dica-demo"></p>
  </form>
</main>

<script type="module" src="/js/login.js"></script>
</body>
</html>
